[package]
name = "orderBookEngine"
version = "0.1.0"
edition = "2024"
authors = ["syashwanth87@gmail.com"]
description = "A high-performance ITCH protocol parser for NASDAQ order book data"
license = "MIT"
repository = "https://github.com/yourusername/orderBookEngine"
keywords = ["itch", "nasdaq", "parser", "order-book", "market-data"]
categories = ["parser-implementations", "finance"]
readme = "README.md"

[lib]
name = "orderBookEngine"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
flate2 = "1.1"
arrow = "48"
parquet = "48"
chrono = "=0.4.39"
